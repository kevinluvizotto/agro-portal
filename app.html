<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Agro Portal</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="#">Agro Portal</a>
            <div class="ms-auto d-flex gap-2">
                <span id="whoami" class="text-muted small align-self-center"></span>
                <button id="btnLogout" class="btn btn-outline-secondary btn-sm">Sair</button>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row g-3">

            <!-- COLUNA ESQUERDA -->
            <div class="col-12 col-lg-5">

                <!-- Card: Enviar leitura -->
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="mb-3">Enviar leitura (Telemetry)</h5>

                        <div class="d-flex gap-2 mb-3">
                            <button id="btnNewProperty" class="btn btn-outline-success btn-sm" type="button">+ Nova Propriedade</button>
                            <button id="btnNewPlot" class="btn btn-outline-success btn-sm" type="button" disabled>+ Novo Talhão</button>
                        </div>

                        <div class="mb-2">
                            <div class="row g-2 mb-3">
                                <div class="col-12">
                                    <label class="form-label">Propriedade</label>
                                    <select id="propertySelect" class="form-select">
                                        <option value="">Carregando...</option>
                                    </select>
                                </div>

                                <div class="col-12">
                                    <label class="form-label">Talhão</label>
                                    <select id="plotSelect" class="form-select" disabled>                                        
                                        <option value="">Selecione uma propriedade primeiro</option>
                                    </select>
                                    <div class="mt-2">
                                        <span class="text-muted small">Status do Talhão:</span>
                                        <span id="plotStatusBadge" class="badge text-bg-secondary">—</span>
                                    </div>
                                    <div class="form-text">O Talhão selecionado preenche o ID automaticamente.</div>
                                </div>
                            </div>

                            <label class="form-label">ID do Talhão</label>
                            <div class="input-group">
                                <input id="plotId" class="form-control" placeholder="GUID (opcional)" />
                                <button id="btnGenPlot" class="btn btn-outline-secondary" type="button">Gerar</button>
                            </div>
                            <div class="form-text">Se vazio, o portal gera automaticamente.</div>
                        </div>

                        <div class="row g-2">
                            <div class="col-4">
                                <label class="form-label">Umidade do Solo</label>
                                <input id="soilMoisture" class="form-control" type="number" step="0.1" value="25.5" />
                            </div>
                            <div class="col-4">
                                <label class="form-label">Temp (C)</label>
                                <input id="temperatureC" class="form-control" type="number" step="0.1" value="29.1" />
                            </div>
                            <div class="col-4">
                                <label class="form-label">Precip (mm)</label>
                                <input id="precipitationMm" class="form-control" type="number" step="0.1" value="0.0" />
                            </div>
                        </div>

                        <button id="btnSend" class="btn btn-success w-100 mt-3">Enviar leitura</button>

                        <div id="sendMsg" class="small mt-2"></div>
                    </div>
                </div>

                <!-- Card: Histórico (Gráfico) -->
                <div class="card shadow-sm mt-3">
                    <div class="card-body">
                        <div class="d-flex align-items-center justify-content-between">
                            <h5 class="mb-0">Histórico (Gráfico)</h5>
                            <button id="btnLoadHistory" class="btn btn-outline-success btn-sm">Carregar</button>
                        </div>

                        <div class="mt-3">
                            <canvas id="historyChart" height="140"></canvas>
                        </div>

                        <div id="historyMsg" class="small text-muted mt-2"></div>
                    </div>
                </div>

            </div>

            <!-- COLUNA DIREITA -->
            <div class="col-12 col-lg-7">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="d-flex align-items-center justify-content-between">
                            <h5 class="mb-0">Alertas</h5>
                            <button id="btnRefresh" class="btn btn-outline-primary btn-sm">Atualizar</button>
                        </div>

                        <div class="row g-2 mt-3">
                            <div class="col-4">
                                <label class="form-label">Severidade</label>
                                <select id="severity" class="form-select">
                                    <option value="">(todas)</option>
                                    <option value="CRITICAL">CRITICAL</option>
                                    <option value="WARN">WARN</option>
                                    <option value="INFO">INFO</option>
                                </select>
                            </div>
                            <div class="col-4">
                                <label class="form-label">Status</label>
                                <select id="ack" class="form-select">
                                    <option value="">(todos)</option>
                                    <option value="false">pendentes</option>
                                    <option value="true">reconhecidos</option>
                                </select>
                            </div>
                            <div class="col-4">
                                <label class="form-label">ID do Talhão</label>
                                <input id="filterPlotId" class="form-control" placeholder="GUID" />
                            </div>                            
                        </div>

                        <div class="table-responsive mt-3">
                            <table class="table table-sm align-middle">
                                <thead>
                                    <tr>
                                        <th>Severidade</th>
                                        <th>Tipo</th>
                                        <th>Umidade</th>
                                        <th>ID do Talhão</th>
                                        <th>Data de Criação</th>
                                        <th>Status</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="alertsBody"></tbody>
                            </table>
                        </div>

                        <div id="alertsMsg" class="small text-muted"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Modal: Nova Propriedade -->
    <div class="modal fade" id="modalProperty" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Nova Propriedade</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Nome</label>
                        <input id="propName" class="form-control" placeholder="Fazenda Santa Maria" />
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Localização</label>
                        <input id="propLocation" class="form-control" placeholder="Sorocaba/SP" />
                    </div>
                    <div id="propMsg" class="small text-danger d-none mt-2"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" id="btnSaveProperty" class="btn btn-success">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Novo Talhão -->
    <div class="modal fade" id="modalPlot" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Novo Talhão</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Nome</label>
                        <input id="plotName" class="form-control" placeholder="Talhão 01" />
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Cultura (crop)</label>
                        <input id="plotCrop" class="form-control" placeholder="Soja" />
                    </div>
                    <div id="plotMsg" class="small text-danger d-none mt-2"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" id="btnSavePlot" class="btn btn-success">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts (sem duplicar) -->
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
